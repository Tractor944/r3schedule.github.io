<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
    
<title>R3 Timing Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ================= BASE ================= */

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#222629;
font-family:Arial,Helvetica,sans-serif;
color:white;
overflow:ajto;
}

body{
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

/* SOLO quando lo schedule è aperto */
body.showSchedule{
overflow:hidden;
}

/*NO SELECT*/
/* Disable text selection everywhere */
body {
    user-select: none;
    -webkit-user-select: none; /* Safari */
    -moz-user-select: none;    /* Firefox */
    -ms-user-select: none;     /* Old Edge */
}

/* ================= MAIN ================= */

.container{text-align:center;}

.logo{
max-width:60vw;
max-height:20vh;
margin-bottom:3vh;
}

.date{font-size:3vw;opacity:.85;}

.session-name{
font-size:7vw;
font-weight:bold;
margin:2vh;
}

.countdown{
font-size:14vw;
font-weight:bold;
}

.next-session{
font-size:2.5vw;
opacity:.8;
margin-top:2vh;
}

/* ================= CLOCK ================= */

.clock{
position:absolute;
top:2vh;
right:2vw;
background:white;
color:black;
padding:10px 18px;
border-radius:18px;
text-align:right;
font-family:monospace;
}

.current-time{
font-size:3vw;
font-weight:bold;
}

.current-date{
font-size:1.8vw;
}

/* ================= SCHEDULE ================= */


.scheduleOverlay{
position:fixed; /* <-- fondamentale */
top:0;
left:0;
width:100%;
height:100%;
background:#000e;
display:none;
overflow-y:auto; /* solo verticale */
-webkit-overflow-scrolling:touch; /* smooth mobile */
padding:3vh;
overscroll-behavior:contain;
}

table{
width:100%;
border-collapse:collapse;
font-size:clamp(12px, 1.2vw, 20px);
}

th,td{
padding:10px;
border-bottom:1px solid #555;
text-align:left;
}

th{
background:#111;
text-transform:uppercase;
}

td:nth-child(2),
td:nth-child(3),
td:nth-child(4){
white-space:nowrap;
}
    
    
.next-start{
color:#EE4B2B;
font-weight:bold;
margin-top:.5vh;
}

/* DAY SEPARATOR */

.dayHeader{
background:#000;
color:#EE4B2B;
font-weight:bold;
text-align:left;
padding:10px;
border-top:2px solid #EE4B2B;
border-bottom:2px solid #EE4B2B;
}

.dayRow{
display:table-row;
}

/* STATES */

.past{
color:#777;
text-decoration:line-through;
}

.current{
color:#00ff88;
font-weight:bold;
}

/* HOTKEY LEGEND */
.hotkeyLegend{
position:absolute;
bottom:1.5vh;
right:1.5vw;

font-size:0.9vw;
line-height:1.4;

color:#aaa;
opacity:0.35;

background:#0006;
padding:8px 12px;
border-radius:6px;

font-family:monospace;

pointer-events:auto;
transition:opacity .25s ease;
}

.hotkeyLegend:hover{
opacity:.85;
}

/* ================= SCHEDULE BUTTON ================= */

.scheduleBtn{

position:absolute;
bottom:2vh;
left:2vw;

font-size:1.2vw;
padding:10px 18px;

background:#EE4B2B;
border:none;
border-radius:8px;

color:white;
font-weight:bold;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,0.4);

}

/* ================= GO LIVE TIMING ================= */

.livetimingBtn{

position:absolute;
bottom:8vh;
left:2vw;

font-size:1.2vw;
padding:10px 18px;

background:#EE4B2B;
border:none;
border-radius:8px;

color:white;
font-weight:bold;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,0.4);

}

/* ================= GO LIVE STREAMING ================= */

.livestreamBtn{

position:absolute;
bottom:14vh;
left:2vw;

font-size:1.2vw;
padding:10px 18px;

background:#EE4B2B;
border:none;
border-radius:8px;

color:white;
font-weight:bold;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,0.4);

}

.button-container {
  display: flex;
  flex-wrap: wrap; /* Allows buttons to wrap on smaller screens */
  gap: 15px;      /* Consistent space between buttons horizontally and vertically */
  justify-content: center; /* Centers buttons; use 'flex-start' for left-aligned */
}


/* MOBILE SIZE */
@media (max-width: 768px){

/* font leggibile */
table{
font-size:14px;
}

/* meno spazio tra celle */
th, td{
padding:6px;
}

/* NASCONDE colonna Date */
th:nth-child(1),
td:nth-child(1){
display:none;
}

/* NASCONDE colonna End */
th:nth-child(3),
td:nth-child(3){
display:none;
}

/* evidenzia nome sessione */
td:nth-child(5){
font-weight:bold;
}
/*dayheader */
.dayRow td{
display:table-cell !important;
}

.dayHeader{
display:table-cell !important;
width:100%;
font-size:16px;
}

tr:has(.dayHeader){
display:table-row;
}

.dayHeader{
display:block;
width:100%;
}

/* test mobile */
/* ================= SCHEDULE BUTTON ================= */

.scheduleBtn{
/*
position:absolute;
bottom:2vh;
left:2vw;
*/
font-size:3vw;
padding:5px 5px;

background:#EE4B2B;
border:none;
border-radius:8px;

color:white;
font-weight:bold;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,0.4);

}

/* ================= GO LIVE TIMING ================= */

.livetimingBtn{
/*
position:absolute;
bottom:2vh;
left:25vw;
*/
font-size:3vw;
padding:5px 5px;

background:#EE4B2B;
border:none;
border-radius:8px;

color:white;
font-weight:bold;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,0.4);

}

/* ================= GO LIVE STREAMING ================= */

.livestreamBtn{
/*
position:absolute;
bottom:2vh;
left:49vw; 
*/

font-size:3vw;
padding:5px 5px;

background:#EE4B2B;
border:none;
border-radius:8px;

color:white;
font-weight:bold;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,0.4);

}

.button-container {
  display: flex;
  flex-wrap: wrap; /* Allows buttons to wrap on smaller screens */
  gap: 15px;      /* Consistent space between buttons horizontally and vertically */
  justify-content: center; /* Centers buttons; use 'flex-start' for left-aligned */
}

}



</style>
</head>

<body>

<!-- CLOCK -->
<div class="clock">
<div id="currentTime" class="current-time"></div>
<div id="currentDate" class="current-date"></div>
</div>

<!-- MAIN -->
<div class="container">
<img src="logo.png" class="logo">
<div id="date" class="date"></div>
<div id="title" class="session-name"></div>
<div id="timer" class="countdown"></div>
<div class="next-session">
<div id="nextSession"></div>
<div id="nextStart" class="next-start"></div>
</div>
</div>

<!-- SCHEDULE -->
<div id="scheduleOverlay" class="scheduleOverlay">
<h1>R02 Sebring</h1>
<table id="scheduleTable"></table>
</div>

<!--/************* TEST Container *************/ -->
<div class="button-container">

<button class="scheduleBtn" onclick="toggleSchedule()">
View Schedule
</button>

<button class="livetimingBtn" onclick="window.open('https://livetiming.alkamelsystems.com/fcna', '_blank');">
  Go Live Timing
</button>

<button class="livestreamBtn" onclick="window.open('https://www.youtube.com/@Ferrari/streams', '_blank');">
  Go Live Streaming
</button>
</div>

<script>

/************* SETTINGS *************/
let dateFormat="US";
let timeOffset=0;
let scheduleVisible=false;
let timeFormat24 = false;

/************* SCHEDULE *************/

let schedule = [];

async function loadCSV(){

const res = await fetch("schedule.csv");
const text = await res.text();

const rows = text.trim().split("\n").slice(1);

schedule = rows.map(r => {

const [date,start,end,title] = r.split(",");

return {
name: title.trim(),
start: date.trim()+"T"+start.trim()+":00",
end: date.trim()+"T"+end.trim()+":00"
};

});

}

/************* ELEMENTS *************/
const titleEl=title;
const timerEl=timer;
const dateEl=date;
const nextStartEl = nextStart;
const nextEl=nextSession;
const clockTime=currentTime;
const clockDate=currentDate;
const overlay=scheduleOverlay;
const table=scheduleTable;


/************* NETWORK TIME *************/
async function syncNetworkTime(){
try{
const r=await fetch("https://worldtimeapi.org/api/ip");
const j=await r.json();
timeOffset=new Date(j.utc_datetime)-Date.now();
}catch{}
}
syncNetworkTime();
setInterval(syncNetworkTime,600000);

function now(){
return new Date(Date.now()+timeOffset);
}

/************* FORMAT *************/
function formatClock(d){

let h = d.getHours();
let m = String(d.getMinutes()).padStart(2,'0');
let s = String(d.getSeconds()).padStart(2,'0');

if(timeFormat24){
    return `${String(h).padStart(2,'0')}:${m}:${s}`;
}

/* ===== 12H FORMAT ===== */

let suffix = h >= 12 ? "PM" : "AM";

h = h % 12;
if(h === 0) h = 12;

return `${h}:${m}:${s} ${suffix}`;
}

function formatDate(d){
const dd=String(d.getDate()).padStart(2,'0');
const mm=String(d.getMonth()+1).padStart(2,'0');
const yyyy=d.getFullYear();

return dateFormat==="US"
?`${mm}-${dd}-${yyyy}`
:`${dd}/${mm}/${yyyy}`;
}

function formatTime(ms){
const t=Math.max(0,Math.floor(ms/1000));
return new Date(t*1000).toISOString().substr(11,8);
}

function formatDuration(st,en){
const diff=(en-st)/1000;
const h=String(Math.floor(diff/3600)).padStart(2,'0');
const m=String(Math.floor((diff%3600)/60)).padStart(2,'0');
return `${h}:${m}`;
}

/************* DAY FILTER *************/
function isSameOrFutureDay(eventDate,today){

const e=new Date(eventDate.getFullYear(),
eventDate.getMonth(),
eventDate.getDate());

const t=new Date(today.getFullYear(),
today.getMonth(),
today.getDate());

return e>=t;
}

/************* BUILD SCHEDULE *************/
function buildSchedule(){

const n=now();

table.innerHTML="";

let currentDay="";

table.innerHTML+=
"<tr><th>Date</th><th>Start</th><th>End</th><th>Duration</th><th>Session</th></tr>";

schedule.forEach(s=>{

const st=new Date(s.start);
const en=new Date(s.end);

if(!isSameOrFutureDay(st,n)) return;

/* DAY SEPARATOR */
const dayKey=st.toDateString();

if(dayKey !== currentDay){
    currentDay = dayKey;

const isMobile = window.innerWidth <= 768;
const colSpan = isMobile ? 3 : 5;

table.innerHTML += `
<tr class="dayRow">
<td class="dayHeader" colspan="5">${formatDate(st)}</td>
</tr>`;
}

let cls="";
if(n>en) cls="past";
else if(n>=st&&n<=en) cls="current";

table.innerHTML+=`
<tr class="${cls}">
<td>${formatDate(st)}</td>
<td>${formatClock(st)}</td>
<td>${formatClock(en)}</td>
<td>${formatDuration(st,en)}</td>
<td>${s.name}</td>
</tr>`;
});
}

/************* FULLSCREEN *************/
function enterFullscreen(){
document.documentElement.requestFullscreen().catch(()=>{});
}
/* DISABLE FULLSCREEN
window.onclick=enterFullscreen;
*/

/************* MAIN LOOP *************/
function update(){

const n=now();

clockTime.textContent=formatClock(n);
clockDate.textContent=formatDate(n);
dateEl.textContent=formatDate(n);

let nextName="";
let nextStart="";

for(let i=0;i<schedule.length;i++){

const s=schedule[i];
const start=new Date(s.start);
const end=new Date(s.end);

if(n<start){
titleEl.textContent="Start of "+s.name;
timerEl.textContent=formatTime(start-n);
nextName=s.name;
nextStart=formatClock(start);
break;
}

if(n>=start&&n<end){
titleEl.textContent="Now: "+s.name;
timerEl.textContent=formatTime(end-n);
if(schedule[i+1]){
nextName=schedule[i+1].name;
nextStart=formatClock(
    new Date(schedule[i+1].start)
);
}
break;
}
}

nextEl.textContent=
nextName?("Next: "+nextName):"Event Complete";
nextStartEl.textContent=nextStart;

// if(scheduleVisible) buildSchedule();
}

loadCSV().then(()=>{
update();
setInterval(update,250);
window.addEventListener("resize", ()=>{
if(scheduleVisible) buildSchedule();
});
});

/************* TOGGLE SCHEDULE *************/
function toggleSchedule(){

scheduleVisible=!scheduleVisible;

overlay.style.display=
scheduleVisible?"block":"none";

buildSchedule();

}

/************* HOTKEYS *************/
document.addEventListener("keydown",e=>{

if(e.key.toLowerCase()==="d"){
dateFormat=dateFormat==="IT"?"US":"IT";
if(scheduleVisible)
    buildSchedule();
}


if(e.key.toLowerCase()==="s"){
scheduleVisible=!scheduleVisible;

overlay.style.display =
scheduleVisible ? "block" : "none";

/* abilita scroll */
document.body.classList.toggle("showSchedule", scheduleVisible);

buildSchedule();
}

if(e.key.toLowerCase()==="t"){
timeFormat24 = !timeFormat24;

if(scheduleVisible)
    buildSchedule();
}

if(e.key.toLowerCase()==="f")
enterFullscreen();

});

</script>
<div class="hotkeyLegend">
<b>HOTKEYS</b><br>
S - Schedule<br>
D - Date format<br>
T - 12H / 24H<br>
F - Fullscreen
</div>
</body>
</html>
